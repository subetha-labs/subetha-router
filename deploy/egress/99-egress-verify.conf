# /etc/systemd/system/docker.service.d/99-egress-verify.conf -- TEST ONLY, installed by
# `subetha-egress-verify --reboot-prepare` and removed by `--reboot-cleanup`.
# Docker does not start unless both verification observers are ready, so a missing observer
# invalidates the reboot test instead of silently weakening it.
[Unit]
Requires=egress-boot-capture.service egress-host-observer.service
After=egress-boot-capture.service egress-host-observer.service
