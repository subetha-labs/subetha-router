# /etc/systemd/system/docker.service.d/10-subetha-egress.conf
# The egress rules are installed by dockerd's own start sequence, before it restores
# --restart containers. If they cannot be installed, docker.service fails to start.
# (A separate unit with Requires= would restart Docker whenever the unit is restarted.)
[Service]
ExecStartPre=/usr/local/sbin/subetha-egress apply
